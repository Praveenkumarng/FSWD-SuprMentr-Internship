<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopVerse — Product Listing</title>
  <meta name="description" content="Browse our curated collection of top-rated products across electronics, clothing, books, home goods, and sports equipment." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">ShopVerse</span>
      </div>
      <div class="header-search">
        <span class="search-icon">🔍</span>
        <input
          id="search-input"
          type="text"
          placeholder="Search products…"
          autocomplete="off"
          aria-label="Search products"
        />
      </div>
      <div class="cart-badge" id="cart-toggle-btn">
        <span>🛒</span>
        <span class="cart-count" id="cart-count">0</span>
      </div>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <div class="layout">

    <!-- ===== SIDEBAR FILTERS ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <h3 class="sidebar-title">Categories</h3>
        <div class="category-pills" id="category-pills">
          <!-- injected by JS -->
        </div>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-title">Price Range</h3>
        <div class="price-display">
          <span id="price-min-label">$0</span>
          <span id="price-max-label">$1000</span>
        </div>
        <input
          id="price-range"
          type="range"
          min="0"
          max="1000"
          step="10"
          value="1000"
          aria-label="Maximum price filter"
        />
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-title">Sort By</h3>
        <select id="sort-select" aria-label="Sort products">
          <option value="default">Featured</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
          <option value="rating-desc">Top Rated</option>
          <option value="name-asc">Name: A → Z</option>
        </select>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-title">Min Rating</h3>
        <div class="rating-filter" id="rating-filter">
          <!-- injected by JS -->
        </div>
      </div>

      <button class="clear-btn" id="clear-btn">✕ Clear All Filters</button>
    </aside>

    <!-- ===== PRODUCT GRID ===== -->
    <main class="main-content">
      <div class="results-bar">
        <p class="results-count" id="results-count">Loading…</p>
        <button class="toggle-sidebar-btn" id="toggle-sidebar" aria-label="Toggle filters">⚙ Filters</button>
      </div>

      <div class="product-grid" id="product-grid">
        <!-- cards injected by JS -->
      </div>

      <!-- Empty state -->
      <div class="empty-state" id="empty-state" hidden>
        <div class="empty-icon">🔍</div>
        <h2>No products found</h2>
        <p>Try adjusting your filters or search term.</p>
        <button class="clear-btn" onclick="clearFilters()">Clear Filters</button>
      </div>
    </main>
  </div>

  <!-- ===== CART DRAWER ===== -->
  <div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h2 class="cart-title">Your Cart</h2>
      <button class="close-cart" id="close-cart" aria-label="Close cart">✕</button>
    </div>
    <div class="cart-body" id="cart-items-container">
      <!-- Cart items injected by JS -->
      <div class="empty-cart-msg">
        <p>Your cart is empty.</p>
        <button class="clear-btn" id="start-shopping">Start Shopping</button>
      </div>
    </div>
    <div class="cart-footer">
      <div class="cart-summary">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cart-subtotal">$0.00</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="cart-total">$0.00</span>
        </div>
      </div>
      <button class="checkout-btn" id="checkout-btn" disabled>Proceed to Checkout</button>
    </div>
  </aside>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast"></div>

  <script src="script.js?v=123"></script>
</body>
</html>
