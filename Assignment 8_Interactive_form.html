<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6: Interactive Form | Registration</title>
    <style>
        /* ── Reset & Base Styles ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* ── Container ── */
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Subtle Glow Top Border */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #58a6ff, #a371f7);
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .header p {
            color: #8b949e;
            font-size: 0.95rem;
        }

        .assignment-meta {
            font-size: 0.8rem;
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* ── Form Groups ── */
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #c9d1d9;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .form-control::placeholder {
            color: #8b949e;
        }

        /* ── Validation States (Error/Success) ── */
        .form-control.success {
            border-color: #2ea043;
        }

        .form-control.error {
            border-color: #f85149;
        }

        /* Error Text */
        .error-message {
            color: #f85149;
            font-size: 0.8rem;
            margin-top: 6px;
            display: none;
            /* Hidden by default */
            animation: fadeIn 0.3s ease;
        }

        .form-group.error .error-message {
            display: block;
        }

        /* ── Submit Button ── */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #2ea043;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* ── Global Success Message ── */
        .form-success-banner {
            display: none;
            /* Hidden by default */
            background-color: rgba(46, 160, 67, 0.1);
            border: 1px solid #2ea043;
            color: #3fb950;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 500;
            animation: slideDown 0.4s ease;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Create an Account</h1>
            <p>Please fill out the form to register.</p>
        </div>

        <!-- Global Success Message (Shown via JS) -->
        <div class="form-success-banner" id="successBanner">
            🎉 Registration Successful! Welcome aboard.
        </div>

        <form id="interactiveForm">
            <!-- Full Name -->
            <div class="form-group" id="nameGroup">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="e.g. Praveen Kumar N G">
                <div class="error-message" id="nameError">Full name must be at least 3 characters.</div>
            </div>

            <!-- Email Address -->
            <div class="form-group" id="emailGroup">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="e.g. name@example.com">
                <div class="error-message" id="emailError">Please enter a valid email address.</div>
            </div>

            <!-- Password -->
            <div class="form-group" id="passwordGroup">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Create a strong password">
                <div class="error-message" id="passwordError">Password must be at least 8 characters.</div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group" id="confirmGroup">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat your password">
                <div class="error-message" id="confirmError">Passwords do not match.</div>
            </div>

            <button type="submit" class="btn-submit">Register Account</button>
        </form>

    </div>

    <!-- ── JAVASCRIPT VALIDATION ── -->
    <script>
        const form = document.getElementById('interactiveForm');

        // Input fields
        const fullName = document.getElementById('fullName');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');

        // Groups (for error classes)
        const nameGroup = document.getElementById('nameGroup');
        const emailGroup = document.getElementById('emailGroup');
        const passwordGroup = document.getElementById('passwordGroup');
        const confirmGroup = document.getElementById('confirmGroup');

        // Success Banner
        const successBanner = document.getElementById('successBanner');

        // Show Error Form State
        function showError(inputElement, groupElement) {
            inputElement.classList.remove('success');
            inputElement.classList.add('error');
            groupElement.classList.add('error');
        }

        // Show Success Form State
        function showSuccess(inputElement, groupElement) {
            inputElement.classList.remove('error');
            inputElement.classList.add('success');
            groupElement.classList.remove('error');
        }

        // Check if Email is valid format using Regex
        function isValidEmail(emailVal) {
            const regex = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            return regex.test(String(emailVal).toLowerCase());
        }

        // Main Validate Form Function Triggered on Submit
        form.addEventListener('submit', function (e) {
            // Prevent regular form submission (page reload)
            e.preventDefault();

            // Track if entire form is valid
            let isFormValid = true;

            const nameValue = fullName.value.trim();
            const emailValue = email.value.trim();
            const passwordValue = password.value.trim();
            const confirmValue = confirmPassword.value.trim();

            // 1. Validate Name
            if (nameValue.length < 3) {
                showError(fullName, nameGroup);
                isFormValid = false;
            } else {
                showSuccess(fullName, nameGroup);
            }

            // 2. Validate Email
            if (emailValue === '' || !isValidEmail(emailValue)) {
                showError(email, emailGroup);
                isFormValid = false;
            } else {
                showSuccess(email, emailGroup);
            }

            // 3. Validate Password
            if (passwordValue.length < 8) {
                showError(password, passwordGroup);
                isFormValid = false;
            } else {
                showSuccess(password, passwordGroup);
            }

            // 4. Validate Confirm Password (must match passwordValue and not be empty)
            if (confirmValue === '' || confirmValue !== passwordValue) {
                showError(confirmPassword, confirmGroup);
                isFormValid = false;
            } else {
                showSuccess(confirmPassword, confirmGroup);
            }

            // Final check
            if (isFormValid) {
                // If everything is valid, display success banner and clear the form
                successBanner.style.display = 'block';
                form.reset();

                // Clear the green borders after successful submission
                [fullName, email, password, confirmPassword].forEach(input => {
                    input.classList.remove('success');
                });

                // Focus back to top (optional UX)
                window.scrollTo(0, 0);
            } else {
                // Hide banner if they made a mistake subsequent times
                successBanner.style.display = 'none';
            }
        });

        // Add real-time event listeners to instantly validate once they type
        const inputs = [fullName, email, password, confirmPassword];
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                // If they have an error, remove the error state as they type to give them a chance
                if (input.classList.contains('error')) {
                    input.classList.remove('error');
                    input.parentElement.classList.remove('error');
                }
            });
        });

    </script>
</body>

</html>
