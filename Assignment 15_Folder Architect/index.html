<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folder Architect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       ROOT & RESET
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary:   #0d1117;
      --bg-secondary: #161b22;
      --bg-card:      #1c2128;
      --bg-hover:     #21262d;
      --brand:        #58a6ff;
      --brand-soft:   rgba(88,166,255,.12);
      --accent-green: #3fb950;
      --accent-red:   #f85149;
      --accent-yellow:#d29922;
      --accent-purple:#bc8cff;
      --text-primary: #e6edf3;
      --text-muted:   #7d8590;
      --border:       #30363d;
      --border-light: #21262d;
      --radius:       8px;
      --radius-lg:    12px;
      --transition:   0.18s ease;
      --shadow:       0 8px 32px rgba(0,0,0,.45);
    }

    html { font-size: 16px; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================
       HEADER
    ============================================================ */
    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .header-logo svg { color: var(--brand); }

    .header-badge {
      font-size: .7rem;
      font-weight: 600;
      background: var(--brand-soft);
      color: var(--brand);
      border: 1px solid rgba(88,166,255,.25);
      border-radius: 20px;
      padding: 2px 9px;
      letter-spacing: .04em;
    }

    .header-actions { display: flex; gap: .6rem; align-items: center; }

    /* ============================================================
       LAYOUT
    ============================================================ */
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      height: calc(100vh - 60px);
    }

    /* ============================================================
       SIDEBAR
    ============================================================ */
    .sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1rem 1.25rem .75rem;
      border-bottom: 1px solid var(--border-light);
    }
    .sidebar-title {
      font-size: .75rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: .75rem;
    }

    .input-row {
      display: flex;
      gap: .5rem;
    }
    .input-row input {
      flex: 1;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      padding: .55rem .75rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .input-row input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-soft);
    }
    .input-row input::placeholder { color: var(--text-muted); }

    /* ============================================================
       BUTTONS
    ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      font-family: 'Inter', sans-serif;
      font-size: .8rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      padding: .55rem .85rem;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      white-space: nowrap;
      user-select: none;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: var(--brand);
      color: #0d1117;
    }
    .btn-primary:hover { background: #79b8ff; box-shadow: 0 0 12px rgba(88,166,255,.4); }
    .btn-sm { padding: .35rem .65rem; font-size: .75rem; }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
    .btn-danger { background: transparent; color: var(--accent-red); border: 1px solid var(--border); }
    .btn-danger:hover { background: rgba(248,81,73,.1); border-color: var(--accent-red); }
    .btn-green { background: var(--accent-green); color: #0d1117; }
    .btn-green:hover { background: #56d364; box-shadow: 0 0 12px rgba(63,185,80,.4); }

    /* ============================================================
       TYPE TOGGLE
    ============================================================ */
    .type-toggle {
      display: flex;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3px;
      gap: 3px;
      margin-top: .65rem;
    }
    .type-btn {
      flex: 1;
      padding: .35rem;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--text-muted);
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .3rem;
    }
    .type-btn.active {
      background: var(--bg-card);
      color: var(--text-primary);
    }
    .type-btn:hover:not(.active) { color: var(--text-primary); }

    /* ============================================================
       TREE AREA
    ============================================================ */
    .tree-scroll {
      flex: 1;
      overflow-y: auto;
      padding: .75rem .5rem;
    }
    .tree-scroll::-webkit-scrollbar { width: 5px; }
    .tree-scroll::-webkit-scrollbar-track { background: transparent; }
    .tree-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .tree-root { list-style: none; }

    /* ============================================================
       TREE NODES
    ============================================================ */
    .tree-node { position: relative; }
    .tree-children { list-style: none; padding-left: 1.4rem; position: relative; }
    .tree-children::before {
      content: '';
      position: absolute;
      left: .6rem;
      top: 0; bottom: 0;
      width: 1px;
      background: var(--border);
    }

    .node-row {
      display: flex;
      align-items: center;
      gap: .4rem;
      padding: .3rem .5rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background var(--transition);
      position: relative;
      user-select: none;
    }
    .node-row:hover { background: var(--bg-hover); }
    .node-row.selected { background: var(--brand-soft); }

    .node-toggle {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
      font-size: .65rem;
      transition: transform var(--transition);
    }
    .node-toggle.open { transform: rotate(90deg); }
    .node-toggle.leaf { opacity: 0; pointer-events: none; }

    .node-icon { flex-shrink: 0; font-size: 1rem; line-height: 1; }
    .node-label {
      flex: 1;
      font-size: .825rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .node-label-input {
      flex: 1;
      background: var(--bg-primary);
      border: 1px solid var(--brand);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: .825rem;
      padding: 1px 6px;
      outline: none;
    }
    .node-actions {
      display: none;
      gap: .25rem;
      align-items: center;
      flex-shrink: 0;
    }
    .node-row:hover .node-actions,
    .node-row.selected .node-actions { display: flex; }

    .icon-btn {
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      transition: background var(--transition), color var(--transition);
      color: var(--text-muted);
    }
    .icon-btn:hover { background: var(--bg-card); color: var(--text-primary); }
    .icon-btn.del:hover { background: rgba(248,81,73,.15); color: var(--accent-red); }

    /* ============================================================
       MAIN PANEL
    ============================================================ */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-toolbar {
      padding: .85rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-wrap: wrap;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: .25rem;
      font-size: .8rem;
      color: var(--text-muted);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .breadcrumb span { color: var(--text-primary); font-family: 'JetBrains Mono', monospace; }
    .breadcrumb .sep { opacity: .5; }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      gap: 1.5rem;
      flex-direction: column;
    }
    .main-content::-webkit-scrollbar { width: 5px; }
    .main-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ============================================================
       CODE PREVIEW
    ============================================================ */
    .preview-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .75rem 1.1rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .preview-title {
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .preview-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      line-height: 1.75;
      color: var(--text-primary);
      padding: 1.1rem 1.25rem;
      white-space: pre;
      overflow-x: auto;
      max-height: 340px;
      overflow-y: auto;
    }
    .preview-code::-webkit-scrollbar { width: 4px; height: 4px; }
    .preview-code::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* color coding */
    .pc-folder { color: var(--accent-yellow); }
    .pc-file   { color: var(--text-muted); }
    .pc-root   { color: var(--brand); font-weight: 600; }
    .pc-line   { color: var(--border); }

    /* ============================================================
       STATS ROW
    ============================================================ */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: .35rem;
    }
    .stat-label { font-size: .7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }
    .stat-value { font-size: 1.65rem; font-weight: 700; color: var(--text-primary); }
    .stat-value.green { color: var(--accent-green); }
    .stat-value.yellow { color: var(--accent-yellow); }
    .stat-value.blue { color: var(--brand); }
    .stat-value.purple { color: var(--accent-purple); }

    /* ============================================================
       PATH TABLE
    ============================================================ */
    .path-table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--bg-secondary);
      color: var(--text-muted);
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      padding: .6rem 1rem;
      text-align: left;
    }
    tbody tr { border-top: 1px solid var(--border-light); transition: background var(--transition); }
    tbody tr:hover { background: var(--bg-hover); }
    tbody td { padding: .55rem 1rem; font-size: .8rem; font-family: 'JetBrains Mono', monospace; }
    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      font-size: .68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      font-family: 'Inter', sans-serif;
    }
    .type-badge.folder { background: rgba(210,153,34,.12); color: var(--accent-yellow); }
    .type-badge.file   { background: rgba(125,133,144,.12); color: var(--text-muted); }

    /* ============================================================
       EMPTY STATE
    ============================================================ */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      padding: 3rem;
      color: var(--text-muted);
      font-size: .85rem;
      opacity: .7;
    }
    .empty-state .es-icon { font-size: 2.5rem; }

    /* ============================================================
       TOAST
    ============================================================ */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      z-index: 999;
    }
    .toast {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .65rem 1rem;
      font-size: .8rem;
      color: var(--text-primary);
      animation: slideIn .22s ease, fadeOut .3s ease 2.2s forwards;
      display: flex;
      align-items: center;
      gap: .5rem;
      min-width: 200px;
      box-shadow: var(--shadow);
    }
    @keyframes slideIn { from { transform: translateX(110%); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(110%); } }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
    </svg>
    Folder Architect
    <span class="header-badge">Assignment</span>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" id="collapseAll">⊟ Collapse All</button>
    <button class="btn btn-ghost btn-sm" id="expandAll">⊞ Expand All</button>
    <button class="btn btn-primary btn-sm" id="exportBtn">↓ Export</button>
  </div>
</header>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">📁 File Explorer</div>
      <div class="input-row">
        <input type="text" id="newName" placeholder="Name..." maxlength="64" autocomplete="off" />
        <button class="btn btn-primary btn-sm" id="addBtn">+ Add</button>
      </div>
      <div class="type-toggle">
        <button class="type-btn active" id="typeFolder" onclick="setType('folder')">
          📁 Folder
        </button>
        <button class="type-btn" id="typeFile" onclick="setType('file')">
          📄 File
        </button>
      </div>
    </div>
    <div class="tree-scroll">
      <ul class="tree-root" id="treeRoot"></ul>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="main-toolbar">
      <div class="breadcrumb" id="breadcrumb">
        <span>root</span>
      </div>
      <button class="btn btn-ghost btn-sm" id="clearBtn">🗑 Clear All</button>
    </div>
    <div class="main-content">

      <!-- STATS -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Folders</div>
          <div class="stat-value yellow" id="statFolders">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Files</div>
          <div class="stat-value blue" id="statFiles">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Max Depth</div>
          <div class="stat-value purple" id="statDepth">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Nodes</div>
          <div class="stat-value green" id="statTotal">0</div>
        </div>
      </div>

      <!-- ASCII TREE PREVIEW -->
      <div class="preview-card">
        <div class="preview-header">
          <div class="preview-title">📋 ASCII Tree Preview</div>
          <button class="btn btn-ghost btn-sm" id="copyTree">Copy</button>
        </div>
        <div class="preview-code" id="asciiPreview">
          <span style="color:var(--text-muted);font-style:italic">Structure will appear here&hellip;</span>
        </div>
      </div>

      <!-- PATH TABLE -->
      <div class="path-table-wrap">
        <div class="preview-header">
          <div class="preview-title">🗂 All Paths</div>
        </div>
        <table id="pathTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Path</th>
              <th>Type</th>
              <th>Depth</th>
            </tr>
          </thead>
          <tbody id="pathTableBody">
            <tr><td colspan="4"><div class="empty-state"><span class="es-icon">🌱</span>No entries yet. Add folders or files to get started.</div></td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>
</div>

<div id="toast-container"></div>

<script>
/* =============================================================
   DATA MODEL
============================================================= */
let tree = [];       // array of root-level nodes
let nodeIdCounter = 1;
let selectedNodeId = null;
let addType = 'folder';

function makeNode(name, type, children = []) {
  return { id: nodeIdCounter++, name, type, children, open: true };
}

/* =============================================================
   TYPE TOGGLE
============================================================= */
function setType(t) {
  addType = t;
  document.getElementById('typeFolder').classList.toggle('active', t === 'folder');
  document.getElementById('typeFile').classList.toggle('active', t === 'file');
}

/* =============================================================
   ADD NODE
============================================================= */
document.getElementById('addBtn').addEventListener('click', addNode);
document.getElementById('newName').addEventListener('keydown', e => { if (e.key === 'Enter') addNode(); });

function addNode() {
  const input = document.getElementById('newName');
  const rawName = input.value.trim();
  if (!rawName) { toast('⚠️ Please enter a name.'); return; }

  // sanitise
  const name = rawName.replace(/[\\/:*?"<>|]/g, '_');
  const node = makeNode(name, addType);

  const sel = findNode(tree, selectedNodeId);
  if (sel && sel.type === 'folder') {
    sel.children.push(node);
    sel.open = true;
  } else {
    tree.push(node);
  }

  input.value = '';
  render();
  toast(`✅ Added ${addType === 'folder' ? '📁' : '📄'} ${name}`);
}

/* =============================================================
   FIND NODE HELPERS
============================================================= */
function findNode(nodes, id) {
  for (const n of nodes) {
    if (n.id === id) return n;
    const found = findNode(n.children, id);
    if (found) return found;
  }
  return null;
}

function deleteNode(nodes, id) {
  for (let i = 0; i < nodes.length; i++) {
    if (nodes[i].id === id) { nodes.splice(i, 1); return true; }
    if (deleteNode(nodes[i].children, id)) return true;
  }
  return false;
}

/* =============================================================
   SELECT
============================================================= */
function selectNode(id) {
  selectedNodeId = (selectedNodeId === id) ? null : id;
  render();
  updateBreadcrumb();
}

function pathToNode(nodes, id, path = []) {
  for (const n of nodes) {
    const p = [...path, n];
    if (n.id === id) return p;
    const found = pathToNode(n.children, id, p);
    if (found) return found;
  }
  return null;
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (!selectedNodeId) { bc.innerHTML = '<span>root</span>'; return; }
  const path = pathToNode(tree, selectedNodeId);
  if (!path) { bc.innerHTML = '<span>root</span>'; return; }
  let html = '<span>root</span>';
  for (const n of path) {
    html += `<span class="sep"> / </span><span>${n.name}</span>`;
  }
  bc.innerHTML = html;
}

/* =============================================================
   RENAME
============================================================= */
function startRename(id, labelEl) {
  const node = findNode(tree, id);
  if (!node) return;
  const inp = document.createElement('input');
  inp.className = 'node-label-input';
  inp.value = node.name;
  labelEl.replaceWith(inp);
  inp.focus(); inp.select();
  function commit() {
    const v = inp.value.trim().replace(/[\\/:*?"<>|]/g, '_');
    if (v) node.name = v;
    render();
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') render(); });
}

/* =============================================================
   RENDER TREE
============================================================= */
function render() {
  const root = document.getElementById('treeRoot');
  root.innerHTML = '';
  if (tree.length === 0) {
    root.innerHTML = '<li><div class="empty-state"><span class="es-icon">🌿</span>Empty tree</div></li>';
  } else {
    tree.forEach(n => root.appendChild(buildNodeEl(n)));
  }
  updateASCII();
  updateStats();
  updateTable();
}

function buildNodeEl(node) {
  const li = document.createElement('li');
  li.className = 'tree-node';

  const row = document.createElement('div');
  row.className = 'node-row' + (node.id === selectedNodeId ? ' selected' : '');
  row.dataset.id = node.id;

  // toggle arrow
  const toggle = document.createElement('span');
  toggle.className = 'node-toggle' +
    (node.type === 'file' ? ' leaf' : (node.open ? ' open' : ''));
  toggle.innerHTML = '▶';
  toggle.addEventListener('click', e => {
    e.stopPropagation();
    if (node.type === 'folder') { node.open = !node.open; render(); }
  });

  // icon
  const icon = document.createElement('span');
  icon.className = 'node-icon';
  if (node.type === 'folder') {
    icon.textContent = node.open && node.children.length ? '📂' : '📁';
  } else {
    icon.textContent = getFileIcon(node.name);
  }

  // label
  const label = document.createElement('span');
  label.className = 'node-label';
  label.textContent = node.name;

  // actions
  const actions = document.createElement('div');
  actions.className = 'node-actions';

  if (node.type === 'folder') {
    const addChildBtn = iconBtn('➕', 'Add child', () => {
      selectedNodeId = node.id;
      node.open = true;
      render();
      document.getElementById('newName').focus();
    });
    actions.appendChild(addChildBtn);
  }

  const renameBtn = iconBtn('✏️', 'Rename', (e) => {
    e.stopPropagation();
    startRename(node.id, label);
  });
  actions.appendChild(renameBtn);

  const delBtn = iconBtn('🗑', 'Delete', (e) => {
    e.stopPropagation();
    if (selectedNodeId === node.id) selectedNodeId = null;
    deleteNode(tree, node.id);
    render();
    toast(`🗑 Deleted "${node.name}"`);
  });
  delBtn.classList.add('del');
  actions.appendChild(delBtn);

  row.addEventListener('click', () => selectNode(node.id));
  row.appendChild(toggle);
  row.appendChild(icon);
  row.appendChild(label);
  row.appendChild(actions);
  li.appendChild(row);

  // children
  if (node.type === 'folder' && node.children.length && node.open) {
    const ul = document.createElement('ul');
    ul.className = 'tree-children';
    node.children.forEach(c => ul.appendChild(buildNodeEl(c)));
    li.appendChild(ul);
  }

  return li;
}

function iconBtn(emoji, title, cb) {
  const b = document.createElement('button');
  b.className = 'icon-btn';
  b.title = title;
  b.textContent = emoji;
  b.addEventListener('click', e => { e.stopPropagation(); cb(e); });
  return b;
}

function getFileIcon(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const map = {
    js:'🟨', ts:'🔷', jsx:'⚛️', tsx:'⚛️', html:'🟧', css:'🎨',
    json:'📋', md:'📝', txt:'📄', png:'🖼', jpg:'🖼', jpeg:'🖼',
    svg:'🎨', pdf:'📕', py:'🐍', java:'☕', cpp:'⚙️', c:'⚙️',
    go:'🐹', rs:'🦀', sh:'🔩', yml:'⚙️', yaml:'⚙️', env:'🔐',
    gitignore:'🙈', lock:'🔒', xml:'📋',
  };
  return map[ext] || '📄';
}

/* =============================================================
   ASCII TREE
============================================================= */
function buildASCII(nodes, prefix = '', isLast = false, isRoot = true) {
  let out = '';
  nodes.forEach((node, i) => {
    const last = i === nodes.length - 1;
    const connector = isRoot ? '' : (last ? '└── ' : '├── ');
    const childPrefix = isRoot ? '' : (last ? '    ' : '│   ');
    const icon = node.type === 'folder' ? '📁 ' : getFileIcon(node.name) + ' ';
    out += prefix + connector + icon + node.name + '\n';
    if (node.type === 'folder' && node.children.length) {
      out += buildASCII(node.children, prefix + childPrefix, last, false);
    }
  });
  return out;
}

function updateASCII() {
  const el = document.getElementById('asciiPreview');
  if (!tree.length) {
    el.innerHTML = '<span style="color:var(--text-muted);font-style:italic">Structure will appear here…</span>';
    return;
  }
  const raw = '📦 root\n' + buildASCII(tree, '', false, false);
  // colour it
  el.innerHTML = raw.split('\n').map(line => {
    if (line.includes('📁')) return `<span class="pc-folder">${escHtml(line)}</span>`;
    if (line.startsWith('📦')) return `<span class="pc-root">${escHtml(line)}</span>`;
    if (line.trim() === '') return '';
    return `<span class="pc-file">${escHtml(line)}</span>`;
  }).filter(Boolean).join('\n');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* =============================================================
   STATS
============================================================= */
function countAll(nodes, depth = 0) {
  let folders = 0, files = 0, maxD = depth;
  for (const n of nodes) {
    if (n.type === 'folder') { folders++; } else { files++; }
    if (n.children.length) {
      const sub = countAll(n.children, depth + 1);
      folders += sub.folders; files += sub.files;
      maxD = Math.max(maxD, sub.maxD);
    }
  }
  return { folders, files, maxD };
}

function updateStats() {
  const { folders, files, maxD } = countAll(tree);
  document.getElementById('statFolders').textContent = folders;
  document.getElementById('statFiles').textContent = files;
  document.getElementById('statDepth').textContent = maxD;
  document.getElementById('statTotal').textContent = folders + files;
}

/* =============================================================
   PATH TABLE
============================================================= */
function getAllPaths(nodes, prefix = 'root') {
  const rows = [];
  for (const n of nodes) {
    const p = prefix + '/' + n.name;
    const depth = p.split('/').length - 2;
    rows.push({ path: p, type: n.type, depth });
    if (n.children.length) rows.push(...getAllPaths(n.children, p));
  }
  return rows;
}

function updateTable() {
  const tbody = document.getElementById('pathTableBody');
  const paths = getAllPaths(tree);
  if (!paths.length) {
    tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state"><span class="es-icon">🌱</span>No entries yet. Add folders or files to get started.</div></td></tr>';
    return;
  }
  tbody.innerHTML = paths.map((r, i) => `
    <tr>
      <td style="color:var(--text-muted)">${i+1}</td>
      <td>${r.path}</td>
      <td><span class="type-badge ${r.type}">${r.type === 'folder' ? '📁 folder' : '📄 file'}</span></td>
      <td style="color:var(--text-muted)">${r.depth}</td>
    </tr>
  `).join('');
}

/* =============================================================
   TOOLBAR ACTIONS
============================================================= */
document.getElementById('expandAll').addEventListener('click', () => {
  setOpenAll(tree, true); render(); toast('⊞ Expanded all');
});
document.getElementById('collapseAll').addEventListener('click', () => {
  setOpenAll(tree, false); render(); toast('⊟ Collapsed all');
});
document.getElementById('clearBtn').addEventListener('click', () => {
  if (!tree.length) return;
  if (confirm('Clear the entire structure?')) {
    tree = []; selectedNodeId = null; render();
    toast('🗑 Cleared all nodes');
  }
});
document.getElementById('copyTree').addEventListener('click', () => {
  if (!tree.length) { toast('⚠️ Nothing to copy'); return; }
  const text = '📦 root\n' + buildASCII(tree, '', false, false)
    .replace(/📁 /g,'📁 ').replace(/[^\x00-\x7F ]/gu, m => m); // keep emojis
  navigator.clipboard.writeText(text).then(() => toast('✅ ASCII tree copied!'));
});

document.getElementById('exportBtn').addEventListener('click', exportJSON);
function exportJSON() {
  const blob = new Blob([JSON.stringify({ root: tree }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'folder-structure.json';
  a.click();
  toast('📥 Exported as JSON');
}

function setOpenAll(nodes, val) {
  for (const n of nodes) { n.open = val; setOpenAll(n.children, val); }
}

/* =============================================================
   TOAST
============================================================= */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 2700);
}

/* =============================================================
   SEED DATA
============================================================= */
function seed() {
  const proj = makeNode('my-project', 'folder');
  const src  = makeNode('src', 'folder');
  const comp = makeNode('components', 'folder');
  comp.children.push(makeNode('Header.jsx', 'file'), makeNode('Footer.jsx', 'file'), makeNode('Button.jsx', 'file'));
  const pages= makeNode('pages', 'folder');
  pages.children.push(makeNode('Home.jsx', 'file'), makeNode('About.jsx', 'file'));
  src.children.push(comp, pages, makeNode('App.jsx','file'), makeNode('index.js','file'));

  const pub  = makeNode('public', 'folder');
  pub.children.push(makeNode('index.html','file'), makeNode('favicon.ico','file'));

  proj.children.push(src, pub, makeNode('package.json','file'), makeNode('.gitignore','file'), makeNode('README.md','file'));
  tree.push(proj);
  render();
}
seed();
