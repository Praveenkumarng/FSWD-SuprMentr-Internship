<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Master | Bookstore API</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="app-container">
        <header>
            <h1 id="main-title">Route Master</h1>
            <p class="subtitle">Experience the ultimate Bookstore API Dashboard</p>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" id="books-tab">Books</button>
            <button class="tab-btn" id="authors-tab">Authors</button>
        </nav>

        <section class="content-section">
            <div class="action-bar">
                <h2 id="section-title">Manage Books</h2>
                <button class="primary-btn" id="add-btn">+ Add New</button>
            </div>

            <div class="data-grid" id="data-grid">
                <!-- Data will be populated here -->
                <div class="loader">Loading...</div>
            </div>
        </section>
    </main>

    <!-- Modal for adding/editing -->
    <div class="modal" id="form-modal">
        <div class="modal-content">
            <h2 id="modal-title">Add New Entry</h2>
            <form id="data-form">
                <div id="form-fields">
                    <!-- Fields dynamic -->
                </div>
                <div class="modal-actions">
                    <button type="button" class="secondary-btn" id="cancel-btn">Cancel</button>
                    <button type="submit" class="primary-btn">Save Entry</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
